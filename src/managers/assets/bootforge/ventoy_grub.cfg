# ==============================================================================
#  BootForge Tools — press F6 in the boot menu to open this page.
#
#  The MAIN boot menu is generated automatically: every .iso / .wim / .vhd(x) /
#  .img / .efi file you copy anywhere onto the BOOTFORGE partition is listed
#  there, on Legacy BIOS and on UEFI. This page only adds recovery tools.
#
#  Works on: Legacy BIOS / CSM (grub_platform = pc) and UEFI x64 / IA32 / ARM64.
# ==============================================================================

menuentry "System information (firmware, CPU, drive)" --class=bootforge {
    echo "=============================================================="
    echo "  BootForge Tools"
    echo "=============================================================="
    echo "  Firmware mode   : $grub_platform  (pc = Legacy BIOS, efi = UEFI)"
    echo "  CPU             : $grub_cpu"
    echo "  Data partition  : $vtoy_iso_part"
    echo "  Boot partition  : $vtoy_efi_part"
    echo ""
    echo "  An image is missing from the main menu?"
    echo "   - copy it again; the file must not be 0 bytes"
    echo "   - names with special characters: rename to letters/digits"
    echo "  Black screen after choosing an image?"
    echo "   - boot again and pick it in 'Normal' mode, or add nomodeset"
    echo "=============================================================="
    echo ""
    echo "Press Enter to return"
    read
}

menuentry "List all disks and partitions" --class=drive {
    ls -l
    echo ""
    echo "Press Enter to return"
    read
}

menuentry "Boot the Windows already installed on this computer" --class=windows {
    if [ "$grub_platform" = "efi" ]; then
        search --no-floppy --file --set=win_root /EFI/Microsoft/Boot/bootmgfw.efi
        if [ -n "$win_root" ]; then
            chainloader ($win_root)/EFI/Microsoft/Boot/bootmgfw.efi
            boot
        fi
    else
        search --no-floppy --file --set=win_root /bootmgr
        if [ -n "$win_root" ]; then
            insmod ntldr
            ntldr ($win_root)/bootmgr
            boot
        fi
        search --no-floppy --file --set=win_root /ntldr
        if [ -n "$win_root" ]; then
            insmod ntldr
            ntldr ($win_root)/ntldr
            boot
        fi
    fi
    echo "No installed Windows boot manager was found on any disk."
    echo "Press Enter to return"
    read
}

menuentry "Boot the Linux already installed on this computer" --class=linux {
    if [ "$grub_platform" = "efi" ]; then
        for d in ubuntu debian fedora opensuse centos rocky almalinux redhat arch manjaro pop neon elementary zorin kali endeavouros cachyos nixos; do
            for f in shimx64.efi grubx64.efi grubaa64.efi shimaa64.efi; do
                search --no-floppy --file --set=lx_root /EFI/$d/$f
                if [ -n "$lx_root" ]; then
                    chainloader ($lx_root)/EFI/$d/$f
                    boot
                fi
            done
        done
    else
        search --no-floppy --file --set=lx_root /boot/grub/grub.cfg
        if [ -n "$lx_root" ]; then
            set root=$lx_root
            configfile /boot/grub/grub.cfg
        fi
        search --no-floppy --file --set=lx_root /grub/grub.cfg
        if [ -n "$lx_root" ]; then
            set root=$lx_root
            configfile /grub/grub.cfg
        fi
        search --no-floppy --file --set=lx_root /boot/grub2/grub.cfg
        if [ -n "$lx_root" ]; then
            set root=$lx_root
            configfile /boot/grub2/grub.cfg
        fi
    fi
    echo "No installed Linux boot loader was found on any disk."
    echo "Press Enter to return"
    read
}

menuentry "Memory test (MemTest86+)" --class=memtest {
    if [ "$grub_platform" = "efi" ]; then
        if [ -f ($vtoy_iso_part)/bootforge/tools/memtest64.efi ]; then
            chainloader ($vtoy_iso_part)/bootforge/tools/memtest64.efi
            boot
        fi
    else
        if [ -f ($vtoy_iso_part)/bootforge/tools/memtest32.bin ]; then
            linux16 ($vtoy_iso_part)/bootforge/tools/memtest32.bin
            boot
        fi
    fi
    echo "MemTest86+ is not on this drive yet."
    echo "Download it from memtest.org and copy memtest64.efi (UEFI) and"
    echo "memtest32.bin (Legacy BIOS) into /bootforge/tools/ on the drive."
    echo "Press Enter to return"
    read
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "Open UEFI firmware settings (BIOS setup)" --class=efi {
        fwsetup
    }
fi

menuentry "Reboot" --class=restart {
    reboot
}

menuentry "Power off" --class=halt {
    halt
}

menuentry "<-- Return to the main menu [Esc]" --class=vtoyret VTOY_RET {
    echo "Return ..."
}
