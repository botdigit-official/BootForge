# ==============================================================================
# ⚡ Botdigit BootForge Boot OS — Universal Master Boot & Recovery Studio
# Supports Legacy BIOS (ThinkPad R400, x86 MBR) and Modern UEFI (x86_64, IA32, ARM64)
# Guaranteed Crisp Typography with Embedded PFF2 Fonts & Zero Tofu Glyphs
# ==============================================================================

set timeout=15
set default=0

# ── 1. HARDWARE & FIRMWARE INITIALIZATION ─────────────────────────────────────
if [ "$grub_platform" = "pc" ]; then
    set firmware_mode="Legacy BIOS (x86 MBR)"
    insmod vbe
    insmod vga
    insmod biosdisk
    set gfxmode=1024x768,800x600,auto
else
    set firmware_mode="UEFI ($grub_cpu)"
    insmod efi_gop
    insmod efi_uga
    set gfxmode=auto
fi

# Essential partition & filesystem drivers
insmod part_gpt
insmod part_msdos
insmod fat
insmod exfat
insmod ntfs
insmod ext2
insmod all_video
insmod font

# ── 2. LOAD PFF2 UNICODE & ASCII FONTS (Fixes [?] Tofu Glyphs) ────────────────
loadfont ($root)/bootforge/fonts/unicode.pf2
loadfont /bootforge/fonts/unicode.pf2
loadfont ($root)/bootforge/fonts/unifont_named.pf2
loadfont /bootforge/fonts/unifont_named.pf2
loadfont ($root)/bootforge/fonts/ascii.pf2
loadfont /bootforge/fonts/ascii.pf2
loadfont ($root)/ventoy/theme/fonts/unicode.pf2
loadfont /ventoy/theme/fonts/unicode.pf2
loadfont ($root)/grub/fonts/unicode.pf2
loadfont /grub/fonts/unicode.pf2

# ── 3. DISPLAY ENGINE & THEME CONFIGURATION ──────────────────────────────────
if terminal_output --append gfxterm; then
    set gfxpayload=keep
    if [ -f /ventoy/theme/theme.txt ]; then
        set theme=/ventoy/theme/theme.txt
    elif [ -f /bootforge/theme/theme.txt ]; then
        set theme=/bootforge/theme/theme.txt
    fi
else
    terminal_output console
    set menu_color_normal=white/black
    set menu_color_highlight=black/light-green
fi

# ── 4. PRIMARY ENTRY: BOTDIGIT BOOTFORGE CONTROL CENTER ───────────────────────
menuentry "[*] BootForge OS Control Center & Live Telemetry" --class bootforge --class os {
    echo "================================================================"
    echo "   BOTDIGIT BOOTFORGE UNIVERSAL BOOT OS"
    echo "   Universal Multi-Boot & Hardware Diagnostics Environment"
    echo "================================================================"
    echo " Firmware Platform : $firmware_mode"
    echo " CPU Architecture  : $grub_cpu"
    echo " Root Drive        : $root"
    echo " Prefix Path       : $prefix"
    echo " Display Driver    : Auto-negotiated video mode active"
    echo " Status            : System Online. Storage Ready."
    echo "================================================================"
    echo ""
    echo "Press [Enter] to return to the main menu..."
    read
}

# ── 5. RECOVERY & STORAGE MANAGER ─────────────────────────────────────────────
submenu "[>] Storage & Drive Manager (Scan Disks & Files)" --class drive {
    menuentry "[-] Scan All Attached Disks & Partitions" {
        echo "Scanning attached block devices and partitions..."
        ls -l
        echo ""
        echo "Press [Enter] to continue..."
        read
    }

    menuentry "[-] View BootForge Images Directory (/images)" {
        echo "Listing contents of /images/..."
        ls (hd0,1)/images/
        ls (hd1,1)/images/
        ls /images/
        echo ""
        echo "Press [Enter] to continue..."
        read
    }
}

# ── 6. 1-CLICK HOST BOOT REPAIR ───────────────────────────────────────────────
submenu "[+] 1-Click Host Boot Repair (Chainload Existing OS)" --class recovery {
    menuentry "[Windows] Chainload Windows Boot Manager" {
        echo "Searching for Windows Boot Manager on internal drives..."
        insmod chain
        search --no-floppy --file --set=win_root /EFI/Microsoft/Boot/bootmgfw.efi
        if [ -n "$win_root" ]; then
            echo "Found Windows Boot Manager on $win_root. Booting..."
            chainloader ($win_root)/EFI/Microsoft/Boot/bootmgfw.efi
            boot
        else
            echo "Error: Windows Boot Manager not found on attached drives."
            echo "Press [Enter] to return..."
            read
        fi
    }

    menuentry "[Linux] Chainload Linux GRUB Bootloader" {
        echo "Searching for Linux EFI bootloader..."
        search --no-floppy --file --set=linux_root /EFI/ubuntu/grubx64.efi
        if [ -z "$linux_root" ]; then
            search --no-floppy --file --set=linux_root /EFI/fedora/grubx64.efi
        fi
        if [ -z "$linux_root" ]; then
            search --no-floppy --file --set=linux_root /EFI/debian/grubx64.efi
        fi

        if [ -n "$linux_root" ]; then
            echo "Found Linux bootloader on $linux_root. Booting..."
            configfile ($linux_root)/boot/grub/grub.cfg
        else
            echo "Error: Linux EFI bootloader not found."
            echo "Press [Enter] to return..."
            read
        fi
    }
}

# ── 7. MEMORY DIAGNOSTICS ─────────────────────────────────────────────────────
menuentry "[RAM] Memory Diagnostics (MemTest86+)" --class memtest --class tool {
    echo "Searching for MemTest86+ binary..."
    if [ -f /bootforge/memtest.bin ]; then
        linux16 /bootforge/memtest.bin
        boot
    elif [ -f /boot/memtest.bin ]; then
        linux16 /boot/memtest.bin
        boot
    else
        echo "Notice: memtest.bin not yet placed in /bootforge/."
        echo "Press [Enter] to return..."
        read
    fi
}

# ── 8. MULTI-OS ISO LAUNCH SUBMENU ────────────────────────────────────────────
submenu "[OS] Launch Multi-OS Payloads (/images)" --class os {
    menuentry "Linux Mint 22.3 (Cinnamon 64-bit)" --class linux {
        search --no-floppy --set=isopart --file /images/linux/linuxmint-22.3-cinnamon-64bit.iso
        if [ -n "$isopart" ]; then
            set isofile="/images/linux/linuxmint-22.3-cinnamon-64bit.iso"
            loopback loop ($isopart)$isofile
            linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=$isofile quiet splash ---
            initrd (loop)/casper/initrd
            boot
        else
            echo "Payload not found: /images/linux/linuxmint-22.3-cinnamon-64bit.iso"
            echo "Copy this ISO into your USB drive to boot it!"
            echo "Press [Enter] to return..."
            read
        fi
    }

    menuentry "Ubuntu 24.04 Desktop" --class ubuntu {
        search --no-floppy --set=isopart --file /images/linux/ubuntu-24.04-desktop-amd64.iso
        if [ -n "$isopart" ]; then
            set isofile="/images/linux/ubuntu-24.04-desktop-amd64.iso"
            loopback loop ($isopart)$isofile
            linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=$isofile quiet splash ---
            initrd (loop)/casper/initrd
            boot
        else
            echo "Payload not found: /images/linux/ubuntu-24.04-desktop-amd64.iso"
            echo "Copy this ISO into your USB drive to boot it!"
            echo "Press [Enter] to return..."
            read
        fi
    }

    menuentry "Windows 11 Installer" --class windows {
        search --no-floppy --set=isopart --file /images/windows/Win11_24H2_English_x64.iso
        if [ -n "$isopart" ]; then
            set isofile="/images/windows/Win11_24H2_English_x64.iso"
            loopback loop ($isopart)$isofile
            chainloader (loop)/efi/boot/bootx64.efi
            boot
        else
            echo "Payload not found: /images/windows/Win11_24H2_English_x64.iso"
            echo "Copy this ISO into your USB drive to boot it!"
            echo "Press [Enter] to return..."
            read
        fi
    }

    menuentry "Clonezilla Live (Disk Imaging & Backup)" --class clonezilla {
        search --no-floppy --set=isopart --file /images/rescue/clonezilla-live-3.1.2-amd64.iso
        if [ -n "$isopart" ]; then
            set isofile="/images/rescue/clonezilla-live-3.1.2-amd64.iso"
            loopback loop ($isopart)$isofile
            linux (loop)/live/vmlinuz boot=live findiso=$isofile quiet
            initrd (loop)/live/initrd.img
            boot
        else
            echo "Payload not found: /images/rescue/clonezilla-live-3.1.2-amd64.iso"
            echo "Copy this ISO into your USB drive to boot it!"
            echo "Press [Enter] to return..."
            read
        fi
    }
}

# ── 9. SYSTEM POWER & FIRMWARE ACTIONS ────────────────────────────────────────
if [ "$grub_platform" = "efi" ]; then
    menuentry "[Setup] Enter UEFI Firmware Setup" --class efi {
        fwsetup
    }
fi

menuentry "[Reboot] Reboot Computer" --class restart {
    reboot
}

menuentry "[Power] Power Off Computer" --class halt {
    halt
}
